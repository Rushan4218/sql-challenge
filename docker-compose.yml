services:
  db: 
    image: postgres:18-alpine
    env_file: 
      - .env
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    volumes:
      - ./database:/database:ro
      - pg_data:/var/lib/postgresql
    ports:
      - ${PORT}:5432
volumes:  
  pg_data:
